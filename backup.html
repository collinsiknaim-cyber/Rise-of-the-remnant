<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
       <style>
        /*Home container styling*/
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: black;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            /* Keeps it phone-sized on desktop */
            background-color:black;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dots {
            filter: brightness(0) invert(1);
        }
        

        .card {
            border-radius: 15px;
            padding: 20px;
            color: white;
            position: relative;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        /* Daily Verse Card styling */
        .daily-verse {
            background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=500');
        }

        .devotional {
            background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url('https://images.unsplash.com/photo-1490730141103-6cac27aaab94?auto=format&fit=crop&w=500');
        }
/* Discover Videos styling */
        .videos {
            background-image: none;
            background-color: #111;
        }

        .video-grid {
            display: grid;
            gap: 12px;
            margin-top: 15px;
        }

        .video-item {
            display: block;
            color: white;
            text-decoration: none;
        }

        .video-item img {
            width: 100%;
            border-radius: 12px;
            display: block;
        }

        .video-item span {
            display: block;
            margin-top: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
        }

        .video-item:hover span {
            text-decoration: none;
            color: red;
        }

        .card h3 {
            margin: 0;
            font-size: 0.9rem;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .card p {
            margin: 5px 0;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .nav-bar {
            position: sticky;
            bottom: 0;
            background-color: black;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid #eee;
            margin-top: auto;
            border-radius: 25px;
			text-decoration: none;
			color: white;
        }
        .icons{filter: brightness(0) invert(1);}
        #splash-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    background-color: #1a1a1a; /* Matches your dark theme */
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10000; /* Must be higher than your nav bar */
    transition: opacity 0.5s ease, visibility 0.5s;
}

.splash-logo {
    width: 120px;
    margin-bottom: 20px;
    border-radius: 20px;
}

/* Optional: Fade out class */
.fade-out {
    opacity: 0;
    visibility: hidden;
}
/*Bible container styling */
       .container{ 
         width: 100%;
            max-width: 450px;
            /* Keeps it phone-sized on desktop */
            background-color:black;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
       }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; padding: 20px; max-width: 800px; margin: auto; background-color: rgb(101, 96, 96); }
        .controls { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        select { padding: 8px; border-radius: 5px; border: 1px solid #ccc; }
        .verse { margin-bottom: 12px; background: rgb(39, 37, 37); padding: 10px; border-radius: 4px; box-shadow: 0 1px 3px rgba(39, 37, 37); text-decoration: none; color: aliceblue;}
        .verse-number { font-weight: bold; color: #2fa4d3; margin-right: 10px; font-size: 0.85em; }
        #loading { color: #555; font-style: italic; }
        h1 { color: #333; }
        .back-button{
            filter: brightness(0) invert(1);
        }
        .icons{
            filter: brightness(0) invert(1);
        }
        .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 450px;
    height: 50px;
    background-color: #1a1a1a; /* Matches your dark theme */
    display: flex;
    justify-content: space-around;
    align-items: center;
    border-top: 1px solid #333;
    z-index: 1000;
    /* This ensures it stays still on mobile browsers */
    padding-bottom: env(safe-area-inset-bottom); 
}

.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: #888;
    font-size: 12px;
}

.nav-item img {
    width: 24px;
    margin-bottom: 4px;
    /* Use the filter method we discussed to make them white */
    filter: brightness(0) invert(1);
}

/* Add space at the bottom of your content */
.container {
    padding-bottom: 80px; 
}
.page{
    display: none;
}
.page.active{
    display: block;}



    </style>
</head>
<body>
<div  class="main-container">
<section  id="home" class="page active">
    <div class="app-container">
        <div class="header">
            <div>
                <div style="color: #2e747d; font-weight: bold;"><font size="5">RISE OF THE REMNANT</font></div>
                <div id="date-today" style="font-size: 1.2rem; font-weight: bold; text-decoration: none; color: #ddd;">Friday, October 27</div>
                <div style="color: #666;" class="invitation" id="invitation-text"></div>
            </div>
    </div>

        <section>
            <h2 style="font-size: 1rem; text-decoration: none; color: #ddd;">Start Your Day</h2>

            <div class="card daily-verse">
                <h3>Daily Verse</h3>
                <p id="verse-text">Loading daily inspiration...</p>
                <small id="verse-ref">—</small>
                <div class="btn-group">
                    <button class="btn">Share</button>
                    <button class="btn">Reflect</button>
                </div>
            </div>
            <div class="card devotional" style="margin-top: 15px;">
                <h3>Today's Devotional</h3>
                <p id="devotional-title">Loading devotional...</p>
                <small id="devotional-length"></small>
                <p id="devotional-desc"></p>
                <div class="btn-group">
                    <button id="devotional-read" class="btn">Read More</button>
                </div>
            </div>
        </div>
        </section>
    </div>
</section>
<section class="page" id="bible">
<div class="container">
    <div>
        <div>
      <a href="index.html" class="back-button"><img src="arrow-circle-left.svg"></a>
        </div>
 
    <h1 style="text-decoration: none; color: #ddd;">HOLY BIBLE NIV VERSION </h1>
    <div class="controls">
        <select id="bookSelect"><option>Loading Books...</option></select>
        <select id="chapterSelect"></select>
    </div>

    <div id="loading"><video autoplay muted loop><source src="loading.mp4" type="video/mp4"></video></div>
    <div id="bible-container"></div>
</div>
 </section>
<section class="page" id="discover">
<div class="card videos" style="margin-top: 15px;">
                <h3>Bible Story Videos</h3>
                <div class="video-grid">
                    <a class="video-item" href="https://www.youtube.com/watch?v=ueh1sErHPeg" target="_blank" rel="noreferrer">
                        <img src="https://img.youtube.com/vi/ueh1sErHPeg/hqdefault.jpg" alt="The Good Samaritan video cover">
                        <span>The Good Samaritan</span>
                    </a>
                    <a class="video-item" href="https://www.youtube.com/watch?v=Gg7_TUO7EpA" target="_blank" rel="noreferrer">
                        <img src="https://img.youtube.com/vi/Gg7_TUO7EpA/hqdefault.jpg" alt="David and Goliath video cover">
                        <span>David and Goliath</span>
                    </a>
                    <a class="video-item" href="https://www.youtube.com/watch?v=pT5qO-lekmE" target="_blank" rel="noreferrer">
                        <img src="https://img.youtube.com/vi/pT5qO-lekmE/hqdefault.jpg" alt="Noah's Ark video cover">
                        <span>Noah's Ark</span>
                    </a>
                </div>
</section>

<nav class="bottom-nav">
    <a href="#" class="nav-item" onclick="showPage('home')">
        <img src="house-line.svg" class="icons">
        <span>Home</span>
    </a>
    <a href="#" class="nav-item" onclick="showPage('bible')">
        <img src="book-open-text.svg" class="icons">
        <span>Bible</span>
    </a>
    <a href="#" class="nav-item" onclick="showPage('discover')">
        <img src="magnifying-glass.svg" class="icons">
        <span>Discover</span>
    </a>
    <a href="#" class="nav-item" onclick="showPage('profile')">
        <img src="user-circle.svg" class="icons">
        <span>Profile</span>
    </a>
</nav>
            
 <script>
      const dateToday = document.getElementById('date-today');
        const now = new Date();
        dateToday.textContent = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

        const dailyVerses = [
            { text: 'For I know the plans I have for you, declares the Lord, plans for welfare and not for evil, to give you a future and a hope.', ref: 'Jeremiah 29:11' },
            { text: 'I can do all things through him who strengthens me.', ref: 'Philippians 4:13' },
            { text: 'Trust in the Lord with all your heart, and do not lean on your own understanding.', ref: 'Proverbs 3:5' },
            { text: 'The Lord is my shepherd; I shall not want.', ref: 'Psalm 23:1' },
            { text: 'Be strong and courageous. Do not be frightened, and do not be dismayed, for the Lord your God is with you wherever you go.', ref: 'Joshua 1:9' }
        ];

        const devotionals = [
            { title: 'Renew Your Mind', length: '10 min read', desc: 'Reflect on Romans 12:2: “be transformed by the renewal of your mind.” Start with prayer today.', book: 'Romans', chapter: '12' },
            { title: 'Walk in Peace', length: '8 min read', desc: 'Psalm 46 reminds us that God is our refuge. Pause and center your day on quiet trust.', book: 'Psalms', chapter: '46' },
            { title: 'Trust, Don’t Worry', length: '12 min read', desc: 'Matthew 6:25-34 teaches to look to our Father for needs. Write one thing you can give to Him today.', book: 'Matthew', chapter: '6' }
        ];

        let currentDevotional = null;

        function pickByDay(list) {
            const index = (now.getFullYear() + now.getMonth() + now.getDate()) % list.length;
            return list[index];
        }

        function renderDailyVerse() {
            const verse = pickByDay(dailyVerses);
            document.getElementById('verse-text').textContent = verse.text;
            document.getElementById('verse-ref').textContent = `— ${verse.ref}`;
        }

        function renderDevotional() {
            const dev = pickByDay(devotionals);
            currentDevotional = dev;
            document.getElementById('devotional-title').textContent = dev.title;
            document.getElementById('devotional-length').textContent = dev.length;
            document.getElementById('devotional-desc').textContent = dev.desc;
        }

        renderDailyVerse();
        renderDevotional();

        // Button actions
        const [shareBtn, reflectBtn] = document.querySelectorAll('.daily-verse .btn-group .btn');
        shareBtn.addEventListener('click', () => {
            const text = `${document.getElementById('verse-text').textContent} ${document.getElementById('verse-ref').textContent}`;
            if (navigator.share) {
                navigator.share({ title: 'Daily Bible Verse', text });
            } else {
                window.prompt('Copy this verse to share:', text);
            }
        });

        reflectBtn.addEventListener('click', () => {
            alert('Reflection prompt: How does today’s verse guide your choices?');
        });

        document.getElementById('devotional-read').addEventListener('click', () => {
            if (currentDevotional && currentDevotional.book && currentDevotional.chapter) {
                const targetUrl = `bible.html?book=${encodeURIComponent(currentDevotional.book)}&chapter=${encodeURIComponent(currentDevotional.chapter)}`;
                window.location.href = targetUrl;
            } else {
                alert('Unable to locate the devotional chapter in the Bible reader.');
            }
        });
        window.addEventListener("load", () => {
    const splash = document.getElementById("splash-screen");
    
    // Add a slight delay (e.g., 1 second) so the user actually sees your nice icon
    setTimeout(() => {
        splash.classList.add("fade-out");
    }, 2000);
});

 // CRITICAL: The URL must be the "RAW" version for fetch to work
        const RAW_URL = 'https://raw.githubusercontent.com/Amosamevor/Bible-json/main/versions/en/NEW%20INTERNATIONAL%20VERSION.json';
        
        const bookSelect = document.getElementById('bookSelect');
        const chapterSelect = document.getElementById('chapterSelect');
        const bibleContainer = document.getElementById('bible-container');
        const loadingText = document.getElementById('loading');

        let bibleData = null;

        async function initApp() {
            try {
                const response = await fetch(RAW_URL);
                if (!response.ok) throw new Error("Failed to fetch JSON");
                
                bibleData = await response.json();
                loadingText.style.display = 'none';

                // 1. Fill the Book dropdown
                bookSelect.innerHTML = '';
                Object.keys(bibleData).forEach(book => {
                    const option = document.createElement('option');
                    option.value = book;
                    option.textContent = book;
                    bookSelect.appendChild(option);
                });

                // 2. Setup listeners
                bookSelect.addEventListener('change', updateChapters);
                chapterSelect.addEventListener('change', displayVerses);

                const params = new URLSearchParams(window.location.search);
                const requestedBook = params.get('book');
                const requestedChapter = params.get('chapter');

                if (requestedBook && bibleData[requestedBook]) {
                    bookSelect.value = requestedBook;
                }

                // Initial Load
                updateChapters();

                if (requestedChapter) {
                    const chapterOption = Array.from(chapterSelect.options).find(option => option.value === requestedChapter);
                    if (chapterOption) {
                        chapterSelect.value = requestedChapter;
                        displayVerses();
                    }
                }

            } catch (error) {
                loadingText.innerText = "Error: Check your internet connection.";
                console.error(error);
            }
        }

        function updateChapters() {
            const selectedBook = bookSelect.value;
            const chapters = bibleData[selectedBook];
            
            chapterSelect.innerHTML = '';
            Object.keys(chapters).forEach(chapNum => {
                const option = document.createElement('option');
                option.value = chapNum;
                option.textContent = `Chapter ${chapNum}`;
                chapterSelect.appendChild(option);
            });

            displayVerses();
        }

        function displayVerses() {
            const book = bookSelect.value;
            const chapter = chapterSelect.value;
            const verses = bibleData[book][chapter];

            bibleContainer.innerHTML = '';
            
            // Map through the verses object
            Object.entries(verses).forEach(([number, text]) => {
                const p = document.createElement('p');
                p.className = 'verse';
                p.innerHTML = `<span class="verse-number">${number}</span> ${text}`;
                bibleContainer.appendChild(p);
            });

            // Scroll to top when chapter changes
            window.scrollTo(0, 0);
        }

        initApp();
        function showPage(pageId) {
    // 1. Find all pages and hide them by removing 'active'
    const pages = document.querySelectorAll('.page');
    pages.forEach(p => {
        p.classList.remove('active');
        p.style.display = 'none'; // Double-check hide
    });

    // 2. Find the clicked page and show it
    const selectedPage = document.getElementById(pageId);
    if (selectedPage) {
        selectedPage.classList.add('active');
        selectedPage.style.display = 'block';
    }

    // 3. Scroll to top of the new "screen"
    window.scrollTo(0, 0);
}
      

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Profile</title>
	
	<style>
		:root {
			color-scheme: dark;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background: radial-gradient(circle at top, rgba(79, 126, 245, 0.14), transparent 30%),
				linear-gradient(180deg, #070b14 0%, #0f1727 40%, #111827 100%);
			color: #e7eef7;
			display: flex;
			justify-content: center;
			padding: 24px 16px 40px;
		}

		.page-shell {
			width: 100%;
			max-width: 460px;
		}

		.top-bar {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 22px;
		}

		.top-bar h1 {
			margin: 0;
			font-size: 1.5rem;
			letter-spacing: -0.02em;
		}

		.top-bar p {
			margin: 4px 0 0;
			color: #94a3b8;
			font-size: 0.95rem;
		}

		.card {
			background: rgba(15, 23, 42, 0.96);
			border: 1px solid rgba(148, 163, 184, 0.12);
			border-radius: 28px;
			box-shadow: 0 24px 60px rgba(15, 23, 42, 0.4);
			padding: 24px;
			margin-bottom: 18px;
			backdrop-filter: blur(14px);
		}

		.profile-photo-card {
			text-align: center;
		}

		.profile-photo-title {
			margin: 0 0 16px;
			font-size: 1rem;
			letter-spacing: 0.02em;
			color: #cbd5e1;
		}

		.photo-circle {
			position: relative;
			width: 130px;
			height: 130px;
			margin: 0 auto 16px;
			border-radius: 50%;
			background: linear-gradient(180deg, rgba(148, 163, 184, 0.16), rgba(148, 163, 184, 0.04));
			border: 1px solid rgba(148, 163, 184, 0.22);
			display: grid;
			place-items: center;
			overflow: hidden;
		}

		.photo-circle img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.upload-action {
			position: absolute;
			right: 8px;
			bottom: 8px;
			width: 34px;
			height: 34px;
			border-radius: 50%;
			background: #f97316;
			display: grid;
			place-items: center;
			cursor: pointer;
			box-shadow: 0 10px 20px rgba(249, 115, 22, 0.28);
		}

		.upload-action input {
			display: none;
		}

		.upload-action::before {
			content: 'F4F7';
			font-size: 0.95rem;
			color: #fff;
		}

		.photo-caption {
			margin: 0;
			color: #94a3b8;
			font-size: 0.9rem;
			line-height: 1.6;
		}

		.info-card h2 {
			margin: 0 0 6px;
			font-size: 1.05rem;
		}

		.info-card p {
			margin: 0;
			color: #94a3b8;
			font-size: 0.93rem;
			line-height: 1.7;
		}

		.info-list {
			margin-top: 18px;
			display: grid;
			gap: 12px;
		}

		.info-item {
			display: grid;
			gap: 6px;
			padding: 14px 16px;
			background: rgba(148, 163, 184, 0.06);
			border: 1px solid rgba(148, 163, 184, 0.12);
			border-radius: 18px;
		}

		.info-item label {
			font-size: 0.8rem;
			color: #94a3b8;
		}

		.info-item strong {
			font-size: 0.98rem;
			color: #f8fafc;
			word-break: break-word;
		}

		.button-row {
			display: flex;
			gap: 12px;
			flex-wrap: wrap;
			margin-top: 22px;
		}

		.button-row button,
		.button-row a {
			border: none;
			border-radius: 999px;
			padding: 12px 18px;
			background: #2563eb;
			color: #fff;
			cursor: pointer;
			text-decoration: none;
			transition: transform 0.2s ease, background 0.2s ease;
		}

		.button-row button:hover,
		.button-row a:hover {
			transform: translateY(-1px);
			background: #1d4ed8;
		}

		.button-row .secondary {
			background: rgba(148, 163, 184, 0.12);
			color: #e2e8f0;
		}

		.signed-out {
			display: none;
			text-align: center;
			padding: 28px;
		}

		.signed-out h2 {
			margin: 0 0 10px;
			font-size: 1.6rem;
		}

		.signed-out p {
			margin: 0 0 22px;
			color: #94a3b8;
			line-height: 1.7;
		}

		@media (max-width: 460px) {
			body {
				padding: 18px 12px 30px;
			}

			.card {
				padding: 20px;
			}

			.profile-top {
				flex-direction: column;
				gap: 14px;
			}
		}
	</style>
</head>

<body>
	<div class="page-shell">
		<div class="top-bar">
			<div>
				<h1>Profile</h1>
				<p>Manage your account</p>
			</div>
			<button class="secondary" type="button" onclick="window.location.href='index.html'">Back</button>
		</div>

		<section id="signed-out" class="signed-out">
			<h2>Welcome back.</h2>
			<p>Sign in or create an account to manage your profile and upload a photo.</p>
			<div class="button-row" style="justify-content:center;">
				<button type="button" onclick="window.location.href='log in.html'">Log In</button>
				<button class="secondary" type="button" onclick="window.location.href='sign-up.html'">Sign Up</button>
			</div>
		</section>

		<section id="profile-card" class="card">
			<div class="profile-photo-card">
				<div class="profile-photo-title">Profile Photo</div>
				<div class="photo-circle">
					<img id="profile-avatar" src="camera.svg" alt="Profile photo">
					<label class="upload-action">
						<input id="profile-photo-input" type="file" accept="image/png,image/jpeg">
					</label>
				</div>
				<p class="photo-caption">Tap to change or remove your photo</p>
			</div>

			<div class="card info-card">
				<h2>Account Info</h2>
				<p>Update your display name, username, and email address from your profile.</p>
				<div class="info-list">
					<div class="info-item">
						<label>Display Name</label>
						<strong id="profile-username">Player</strong>
					</div>
					<div class="info-item">
						<label>Username</label>
						<strong id="profile-display-name">@player</strong>
					</div>
					<div class="info-item">
						<label>Email</label>
						<strong id="profile-email">guest@rise.com</strong>
					</div>
				</div>
				<div class="button-row">
					<button type="button" id="logout-btn">Log Out</button>
				</div>
			</div>
		</section>
	</div>

	<script>
		const profileCard = document.getElementById('profile-card');
		const signedOut = document.getElementById('signed-out');
		const profileAvatar = document.getElementById('profile-avatar');
		const profilePhotoInput = document.getElementById('profile-photo-input');
		const profileUsername = document.getElementById('profile-username');
		const profileDisplayName = document.getElementById('profile-display-name');
		const profileEmail = document.getElementById('profile-email');
		const logoutBtn = document.getElementById('logout-btn');

		function formatUsername(name) {
			if (!name) return '@user';
			const cleaned = name.trim().toLowerCase().replace(/\s+/g, '_');
			return cleaned.startsWith('@') ? cleaned : '@' + cleaned;
		}

		function getAvatarSource(user) {
			return user.profilePic || 'camera.svg';
		}

		function loadProfile() {
			const user = getCurrentUser();
			if (!user) {
				profileCard.style.display = 'none';
				signedOut.style.display = 'block';
				return;
			}

			profileCard.style.display = 'block';
			signedOut.style.display = 'none';

			profileAvatar.src = getAvatarSource(user);
			profileUsername.textContent = user.username || 'User';
			profileDisplayName.textContent = formatUsername(user.username || 'user');
			profileEmail.textContent = user.email || 'guest@rise.com';
		}

		function saveProfilePhoto(imageData) {
			const currentUser = getCurrentUser();
			if (!currentUser || !currentUser.email) return;
			updateUserProfilePic(currentUser.email, imageData);
		}

		function uploadProfilePicture(event) {
			const file = event.target.files[0];
			if (!file) return;
			const reader = new FileReader();
			reader.onload = () => {
				const imageData = reader.result;
				profileAvatar.src = imageData;
				saveProfilePhoto(imageData);
			};
			reader.readAsDataURL(file);
		}

		function logoutProfile() {
			logoutCurrentUser();
			loadProfile();
		}

		profilePhotoInput.addEventListener('change', uploadProfilePicture);
		logoutBtn.addEventListener('click', logoutProfile);
		document.addEventListener('DOMContentLoaded', loadProfile);
	</script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Welcome Back</title>
    <style>
        .main-container{
            background-image: url(Images/Gemini_Generated_Image_cy91npcy91npcy91.png);
            height: 600px;
            width:100%;
        }
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-image:
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* The Login Card */
        .login-container {
            /*background: #ffffff;*/
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            color: #1c1e21;
            margin-bottom: 1.5rem;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #4b4f56;
        }

        input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #1877f2;
        }

        /* Submit Button */
        .login-btn {
            width: 100%;
            padding: 0.8rem;
            background-color: #1877f2;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .login-btn:hover {
            background-color: #166fe5;
        }

        .footer-links {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.85rem;
        }

        .footer-links a {
            color: #1877f2;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
        <link rel="stylesheet" href="style.css">
    <script src="settings.js" defer></script> 
</head>
<body>
<div class="main-container">
    <center><div class="login-container">
        <h2>Login</h2>
        <form action="/submit-your-login-api" method="POST">
            <div class="input-group">
                <label for="email">Email or Username</label>
                <input type="email" id="email" name="email" placeholder="example@mail.com" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn">Log In</button>
        </form>

        <div class="footer-links">
            <p><a href="#">Forgot password?</a></p>
            <hr style="margin: 1.5rem 0; border: 0; border-top: 1px solid #dddfe2;">
            <p>Don't have an account? <a href="sign-up.html">Sign Up</a></p>
        </div>
    </div>
    </center>
</div>
</body>
</html>

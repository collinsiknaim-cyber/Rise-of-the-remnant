<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Welcome Back</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top, rgba(79, 126, 245, 0.18), transparent 36%),
                        linear-gradient(180deg, #060a14 0%, #081224 45%, #0b172b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px;
            color: #eef2ff;
        }

        .main-container {
           /* width: 100%;
            max-width: 420px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(148, 163, 184, 0.14);
            border-radius: 28px;
            box-shadow: 0 28px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;*/
            width: 100%;
            max-width: 450px;
            /* Keeps it phone-sized on desktop */
            background-color:black;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height:100vh;
        }

        .login-container {
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h2 {
            text-align: center;
            color: #f8fafc;
            font-size: 1.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, 0.24);
            background: #0f172a;
            color: #e2e8f0;
            font-size: 1rem;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
        }

        .login-btn {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 18px;
            background: #2563eb;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .footer-links {
            text-align: center;
            margin-top: 10px;
            color: #94a3b8;
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .footer-links hr {
            border: 0;
            border-top: 1px solid rgba(148, 163, 184, 0.18);
            margin: 16px 0;
        }

        .footer-links a {
            color: #60a5fa;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 420px) {
            .main-container {
                border-radius: 24px;
            }

            .login-container {
                padding: 22px;
            }
        }
    </style>
        <link rel="stylesheet" href="style.css">
    <script src="settings.js" defer></script>
    <script src="userDatabase.js" defer></script>
    <script src="emailService.js" defer></script>
</head>
<body>
<div class="main-container">
    <center><div class="login-container">
        <h2>Login</h2>
        <form id="login-form">
            <div class="input-group">
                <label for="login-identifier">Email or Username</label>
                <input type="text" id="login-identifier" name="login-identifier" placeholder="example@mail.com" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <br>

            <button type="submit" class="login-btn">Log In</button>
        </form>

        <div class="footer-links">
            <p><a href="#">Forgot password?</a></p>
            <hr style="margin: 1.5rem 0; border: 0; border-top: 1px solid #dddfe2;">
            <p>Don't have an account? <a href="sign-up.html">Sign Up</a></p>
        </div>
    </div>
    </center>
</div>
<script>
    document.getElementById('login-form').addEventListener('submit', event => {
        event.preventDefault();
        const identifier = document.getElementById('login-identifier').value.trim();
        const password = document.getElementById('password').value;
        const result = loginUser(identifier, password);

        if (!result.success) {
            alert(result.error);
            return;
        }

        sendLoginConfirmation(result.user);
        window.location.href = 'profile.html';
    });
</script>
</body>
</html>

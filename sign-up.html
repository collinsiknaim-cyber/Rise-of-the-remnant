<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top, rgba(79, 126, 245, 0.14), transparent 34%),
                        linear-gradient(180deg, #04070f 0%, #081228 45%, #0b162d 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px;
            color: #eef2ff;
        }

        .background {
            width: 100%;
            max-width: 420px;
            background: rgba(15, 23, 42, 0.97);
            border: 1px solid rgba(148, 163, 184, 0.14);
            border-radius: 28px;
            box-shadow: 0 28px 60px rgba(0, 0, 0, 0.28);
            overflow: hidden;
        }

        .main-container {
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .main-container h1 {
            margin: 0;
            color: #f8fafc;
            font-size: 1.6rem;
            text-align: center;
        }

        .main-container p {
            margin: 0;
            color: #94a3b8;
            font-size: 0.95rem;
            text-align: center;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .input-group {
            width: 100%;
        }

        label {
            color: #94a3b8;
            font-size: 0.95rem;
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, 0.22);
            background: #0f172a;
            color: #e2e8f0;
            font-size: 1rem;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
        }

        .submit-button {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 18px;
            background: #2563eb;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .submit-button:hover {
            background: #1d4ed8;
        }

        .log-in {
            color: #60a5fa;
            text-decoration: none;
        }

        .footer-text {
            color: #94a3b8;
            text-align: center;
            font-size: 0.95rem;
        }

        @media (max-width: 420px) {
            body {
                padding: 14px;
            }

            .background {
                border-radius: 24px;
            }

            .main-container {
                padding: 24px;
            }
        }
    </style>
        <link rel="stylesheet" href="style.css">
    <script src="settings.js" defer></script>
    <script src="userDatabase.js" defer></script>
    <script src="emailService.js" defer></script>
</head>

<body>
    <center>
        <div class="background">
            <div class="main-container">
                    <h1>RISE OF THE REMNANT</h1>
                    <p>Create your account</p>
                    <div class="form">
                    <form id="signup-form">
                        <label for="signup-username">Username</label>
                        <div class="input-group"><input type="text" id="signup-username" placeholder="John Doe" required></div>
                        <label for="signup-email">Email Address</label>
                        <div class="input-group"><input type="email" id="signup-email" placeholder="example@mail.com" required></div>
                        <label for="signup-password">Password</label>
                        <div class="input-group"><input type="password" id="signup-password" placeholder="••••••••" required></div>
                        <label for="signup-confirm-password">Confirm Password</label>
                        <div class="input-group"><input type="password" id="signup-confirm-password" placeholder="••••••••" required></div>
                        <br>
                        <input type="submit" value="CREATE ACCOUNT" class="submit-button">
                    </form>
                    <br>
                    Already have an account?<a href="log in.html" class="log-in">Log in</a>
                </div>
            </div>
    </center>
<script>
    document.getElementById('signup-form').addEventListener('submit', event => {
        event.preventDefault();

        const username = document.getElementById('signup-username').value.trim();
        const email = document.getElementById('signup-email').value.trim();
        const password = document.getElementById('signup-password').value;
        const confirmPassword = document.getElementById('signup-confirm-password').value;

        if (password !== confirmPassword) {
            alert('Passwords do not match.');
            return;
        }

        const result = registerUser({ username, email, password });
        if (!result.success) {
            alert(result.error);
            return;
        }

        alert('Account created successfully. Please check your email for a confirmation message and then log in.');
        sendSignupConfirmation(result.user);
        window.location.href = 'log in.html';
    });
</script>
</body>

</html>
